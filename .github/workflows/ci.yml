name: CI

# Roda em todo push e em toda PR (qualquer branch).
on:
  push:
  pull_request:

# Cancela execucoes antigas da mesma ref quando chega um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: TypeScript (contracts, backend, frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.26.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build (contracts primeiro; -r resolve a ordem por dependencia)
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Testes
        run: pnpm -r test

  python:
    name: Python (mock-sensors)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-sensors
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (projeto + dev)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Testes (pytest)
        run: pytest -q
