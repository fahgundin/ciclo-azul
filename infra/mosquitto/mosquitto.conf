# Configuracao do broker Mosquitto para DESENVOLVIMENTO.
#
# ATENCAO: conexoes anonimas estao habilitadas apenas para facilitar o dev local.
# Em producao, a autenticacao do sensor no broker (usuario/senha ou TLS/mTLS) e
# obrigatoria — ver docs/contrato-iot.md, secao 8 (pontos a confirmar).

# Persistencia das mensagens/retidas entre reinicios.
persistence true
persistence_location /mosquitto/data/

# Logs no stdout (visiveis via `docker compose logs mqtt`).
log_dest stdout

# Listener MQTT padrao (TCP).
listener 1883
protocol mqtt

# Listener WebSocket (util para clientes web/debug).
listener 9001
protocol websockets

# Dev apenas: permite conexao sem credenciais.
allow_anonymous true
