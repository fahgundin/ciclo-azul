[project]
name = "ciclo-azul-mock-sensors"
version = "0.1.0"
description = "Mock de sensores IoT publicando leituras de consumo de agua via MQTT"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt==2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.9",
    "black==24.10.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mock_sensors"]
